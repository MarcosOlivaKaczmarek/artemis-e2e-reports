services:
  app:
    image: ghcr.io/ls1intum/artemis-e2e-reports:latest
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - app-data:/data
    environment:
      - UPLOAD_TOKEN=${UPLOAD_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DB_PATH=/data/reports.db
      - DATA_DIR=/data
      - GITHUB_REPO=${GITHUB_REPO:-ls1intum/Artemis}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-data:
